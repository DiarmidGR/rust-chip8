<!DOCTYPE html>
<html>
    <head>
        <title>CHIP-8 Emulator</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Diarmid's CHIP-8 Emulator</h1>
        <label for="romselect">Select a Chip-8 game: </label>
        <select id="romselect" autocomplete="off"></select>
        <br>
        <canvas id="canvas">If you see this message, then your browser doesn't support HTML5</canvas>
        <div id="controls">
            <div id="INVADERS" class="controls">
                Controls:
                <span>Q: Move Left</span>
                <span>E: Move Right</span>
                <span>W: Shoot</span>
            </div>

            <div id="PONG" class="controls">
                Controls:
                <div class="pong">
                    <div class="pong-left">
                        <span>Left Paddle</span>
                        <span>1: Up</span>
                        <span>Q: Down</span>
                    </div>
                    <div class="pong-right">
                        <span>Right Paddle</span>
                        <span>4: Up</span>
                        <span>R: Down</span>
                    </div>
                </div>
            </div>

            <div id="TETRIS" class="controls">
                Controls:
                <span>Q: Rotate</span>
                <span>W: Move Left</span>
                <span>E: Move Right</span>
                <span>A: Move Down</span>
            </div>
        </div>
    </body>
    <script type="module" src="index.js"></script>
</html>
